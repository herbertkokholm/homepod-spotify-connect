name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck deploy.sh tools/strip-desktop.sh
      - name: ruff
        run: pipx run ruff check volume-bridge.py
